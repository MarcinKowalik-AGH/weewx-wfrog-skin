name: Validate

on:
  push:
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python syntax
        run: python3 -m py_compile bin/*.py extras/envmon/*.py
      - name: Shell syntax
        run: bash -n install.sh uninstall.sh
      - name: Generator smoke test
        run: python3 tests/smoke_test.py
