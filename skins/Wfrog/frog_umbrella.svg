<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 180" role="img" aria-label="Frog under umbrella">
  <rect width="160" height="180" fill="#ffffff"/>
  <!-- umbrella -->
  <path d="M18 70 C30 25, 130 25, 142 70
           C128 60, 116 60, 104 70
           C92 60, 68 60, 56 70
           C44 60, 31 60, 18 70 Z"
        fill="#f5deb3" stroke="#8d7641" stroke-width="3"/>
  <path d="M80 42 V118 C80 137, 98 139, 103 124"
        fill="none" stroke="#8d7641" stroke-width="4" stroke-linecap="round"/>
  <!-- frog head -->
  <circle cx="61" cy="91" r="15" fill="#64a844" stroke="#447b31" stroke-width="2"/>
  <circle cx="99" cy="91" r="15" fill="#64a844" stroke="#447b31" stroke-width="2"/>
  <ellipse cx="80" cy="112" rx="38" ry="31" fill="#70b84c" stroke="#447b31" stroke-width="2"/>
  <!-- eyes -->
  <circle cx="61" cy="88" r="7" fill="#ffffff"/>
  <circle cx="99" cy="88" r="7" fill="#ffffff"/>
  <circle cx="62" cy="89" r="3" fill="#222222"/>
  <circle cx="98" cy="89" r="3" fill="#222222"/>
  <!-- mouth -->
  <path d="M63 118 Q80 131 97 118" fill="none" stroke="#385b2b" stroke-width="2.5" stroke-linecap="round"/>
  <!-- body / legs -->
  <ellipse cx="80" cy="145" rx="28" ry="22" fill="#70b84c" stroke="#447b31" stroke-width="2"/>
  <path d="M58 150 Q38 158 30 169 M102 150 Q122 158 130 169"
        fill="none" stroke="#447b31" stroke-width="8" stroke-linecap="round"/>
  <path d="M61 143 Q48 132 40 137 M99 143 Q112 132 120 137"
        fill="none" stroke="#447b31" stroke-width="7" stroke-linecap="round"/>
</svg>
